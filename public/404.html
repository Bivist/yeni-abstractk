<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#031827" />
  <meta name="robots" content="noindex, nofollow" />
  <title>404 — Rota Bulunamadı | Abstract</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;overflow:hidden;padding:28px 20px;background:#031827;color:#e6f8ff;font-family:Inter,"Plus Jakarta Sans",system-ui,-apple-system,sans-serif}
    .ambient{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 18% 10%,rgba(6,182,212,.16),transparent 42%),radial-gradient(ellipse at 85% 85%,rgba(14,165,233,.13),transparent 45%)}
    .grid{position:fixed;inset:0;pointer-events:none;opacity:.12;background-image:radial-gradient(rgba(125,211,252,.8) .7px,transparent .7px);background-size:27px 27px}
    .waves{position:fixed;bottom:0;left:0;width:100%;height:150px;opacity:.55;pointer-events:none}
    .wrap{position:relative;width:min(100%,620px);text-align:center;display:flex;align-items:center;flex-direction:column}
    .brand{display:inline-flex;align-items:center;gap:10px;margin-bottom:42px;padding:10px 17px;border:1px solid rgba(207,250,254,.16);border-radius:999px;background:rgba(255,255,255,.04);color:#ecfeff;text-decoration:none;font-size:13px;font-weight:800;letter-spacing:.16em}
    .brand svg{width:18px;color:#67e8f9}
    .orb{position:relative;width:190px;height:190px;display:grid;place-items:center;margin-bottom:24px;border:1px solid rgba(103,232,249,.18);border-radius:50%}
    .orb:before{content:"";position:absolute;inset:13px;border:1px dashed rgba(103,232,249,.26);border-radius:50%;animation:spin 32s linear infinite}
    .orb:after{content:"";position:absolute;inset:38px;border-radius:34px;background:linear-gradient(145deg,rgba(34,211,238,.16),rgba(14,165,233,.04));border:1px solid rgba(207,250,254,.2);box-shadow:0 0 65px rgba(34,211,238,.13)}
    .compass{position:relative;z-index:1;width:68px;height:68px;color:#a5f3fc;filter:drop-shadow(0 0 15px rgba(103,232,249,.38))}
    .lost{position:absolute;z-index:2;right:-4px;top:26px;padding:5px 11px;border:1px solid rgba(103,232,249,.22);border-radius:99px;background:#08283a;color:#a5f3fc;font:10px ui-monospace,monospace;letter-spacing:.18em}
    .number{margin:0;font:800 clamp(92px,19vw,138px)/.88 ui-monospace,monospace;letter-spacing:-.1em;color:#a5f3fc;background:linear-gradient(#fff,#a5f3fc 52%,#0891b2);background-clip:text;-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .eyebrow{margin:20px 0 9px;color:#67e8f9;font:700 10px ui-monospace,monospace;letter-spacing:.28em}
    h1{margin:0;color:#fff;font-size:clamp(23px,5vw,31px);letter-spacing:-.04em}
    .desc{max-width:440px;margin:13px 0 0;color:rgba(224,242,254,.68);font-size:14px;line-height:1.9}
    .actions{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:30px}
    .btn{min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:0 22px;border-radius:999px;text-decoration:none;font-size:13px;font-weight:750;transition:transform .2s,filter .2s}
    .btn:hover{transform:translateY(-2px);filter:brightness(1.1)}
    .primary{background:linear-gradient(110deg,#22d3ee,#38bdf8);color:#032033;box-shadow:0 10px 30px rgba(8,145,178,.2)}
    .secondary{border:1px solid rgba(207,250,254,.2);background:rgba(255,255,255,.04);color:#ecfeff;cursor:pointer}
    .foot{margin-top:46px;color:rgba(224,242,254,.3);font:10px ui-monospace,monospace;letter-spacing:.2em}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media(prefers-reduced-motion:reduce){.orb:before{animation:none}.btn{transition:none}}
  </style>
</head>
<body>
  <div class="ambient"></div><div class="grid"></div>
  <svg class="waves" viewBox="0 0 1440 180" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 65 C180 5 300 125 500 75 S820 25 1030 80 S1280 130 1440 55 V180 H0Z" fill="#075985" fill-opacity=".28"/>
    <path d="M0 95 C190 35 340 145 560 100 S900 45 1100 100 S1300 145 1440 90 V180 H0Z" fill="#0891b2" fill-opacity=".2"/>
    <path d="M0 125 C220 75 360 165 590 125 S930 85 1140 130 S1320 165 1440 120 V180 H0Z" fill="#0e7490" fill-opacity=".2"/>
  </svg>
  <main class="wrap">
    <a class="brand" href="/" aria-label="Abstract ana sayfa">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 17c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 5 2"/><path d="M2 21c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 5 2"/></svg>
      ABSTRACT
    </a>
    <div class="orb" aria-hidden="true">
      <svg class="compass" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="m15.8 8.2-2.5 5.1-5.1 2.5 2.5-5.1 5.1-2.5Z"/><path d="M12 2.5v2M21.5 12h-2M12 21.5v-2M2.5 12h2"/></svg>
      <span class="lost">LOST</span>
    </div>
    <p class="number">404</p>
    <p class="eyebrow">BİLİMSEL KEŞİF ROTASI</p>
    <h1>Görünüşe göre rotadan çıktık.</h1>
    <p class="desc">Aradığın sayfa bu sularda yok. Bağlantı değişmiş, sayfa kaldırılmış ya da hiç var olmamış olabilir.</p>
    <div class="actions">
      <a class="btn primary" href="/">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>
        Ana sayfaya dön
      </a>
      <button class="btn secondary" type="button" onclick="if(history.length>1)history.back();else location.href='/'">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7M5 12h14"/></svg>
        Önceki sayfa
      </button>
    </div>
    <p class="foot">ABSTRACT · BİLİMİ KAYDIRARAK KEŞFET</p>
  </main>
</body>
</html>
